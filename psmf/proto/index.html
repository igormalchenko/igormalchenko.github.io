<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSMF Platform prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F1;--surface:#FFFFFF;--surface-2:#EBEEE9;--ink:#17233A;--muted:#5B6577;--rule:#D6DBD3;
  --rail:#17233A;--rail-ink:#DCE3EC;--rail-muted:#8E9BB0;--rail-on:#24344F;
  --btn-bg:#17233A;--btn-ink:#FFFFFF;
  --sign:#0D6B63;--sign-bg:#DDF0EC;--fact:#1D58A6;--fact-bg:#E4EDF9;
  --stale:#8F5406;--stale-bg:#FAEED8;--block:#AE2A21;--block-bg:#FAE4E1;
  --ai:#6340AE;--ai-bg:#EEE8FA;--ins:#D5EEDD;--del:#F6DAD6;--spec:#A1356C;--focus:#1D58A6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141D;--surface:#161D29;--surface-2:#1D2533;--ink:#E4E9F0;--muted:#98A2B3;--rule:#2B3545;
  --rail:#0A0E15;--rail-ink:#DCE3EC;--rail-muted:#7F8BA0;--rail-on:#1B2638;
  --btn-bg:#E4E9F0;--btn-ink:#10151E;
  --sign:#4DBFB1;--sign-bg:#123633;--fact:#86B4F2;--fact-bg:#162A49;
  --stale:#E8AA4E;--stale-bg:#382A12;--block:#F08A80;--block-bg:#3B1B18;
  --ai:#B79CF2;--ai-bg:#2A2046;--ins:#173B27;--del:#40201C;--spec:#E27BB0;--focus:#86B4F2;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F141D;--surface:#161D29;--surface-2:#1D2533;--ink:#E4E9F0;--muted:#98A2B3;--rule:#2B3545;
  --rail:#0A0E15;--rail-ink:#DCE3EC;--rail-muted:#7F8BA0;--rail-on:#1B2638;
  --btn-bg:#E4E9F0;--btn-ink:#10151E;
  --sign:#4DBFB1;--sign-bg:#123633;--fact:#86B4F2;--fact-bg:#162A49;
  --stale:#E8AA4E;--stale-bg:#382A12;--block:#F08A80;--block-bg:#3B1B18;
  --ai:#B79CF2;--ai-bg:#2A2046;--ins:#173B27;--del:#40201C;--spec:#E27BB0;--focus:#86B4F2;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img{max-width:100%}
h1{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;margin:0 0 10px}
h3{font-size:14px;font-weight:600;margin:0}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
.brand{padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.brand b{display:block;font-size:15px;font-weight:600}
.brand span{font-size:12px;color:var(--rail-muted)}
.navg{margin:14px 0 4px;padding:0 10px;font-size:12px;color:var(--rail-muted)}
.nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--rail-ink);padding:7px 10px;border-radius:6px;cursor:pointer}
.nav button:hover{background:var(--rail-on)}
.nav button.on{background:var(--rail-on);box-shadow:inset 3px 0 0 var(--sign)}
.nav .count{font-size:11.5px;background:var(--sign);color:#fff;border-radius:9px;padding:0 7px;min-width:20px;text-align:center}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;gap:14px;align-items:center;justify-content:space-between;padding:10px 28px;flex-wrap:wrap}
.top .title{font-weight:600}
.top .ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;background:var(--sign-bg);color:var(--sign)}
.av.qppv{background:var(--fact-bg);color:var(--fact)}
.av.deputy{background:var(--stale-bg);color:var(--stale)}
select,input[type=text],input[type=date],input[type=password],textarea{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical;min-height:62px}
label.tog{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
#view{padding:24px 28px 60px;max-width:1280px;width:100%}

/* Buttons and pills */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.btn.sign{background:var(--sign);color:#fff;border-color:var(--sign)}
:root[data-theme="dark"] .btn.sign{color:#07201D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.sign{color:#07201D}}
.btn.danger{color:var(--block);border-color:var(--block)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:12px;line-height:1.5;padding:1px 8px;border-radius:10px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--sign-bg);color:var(--sign)}
.pill.warn{background:var(--stale-bg);color:var(--stale)}
.pill.bad{background:var(--block-bg);color:var(--block)}
.pill.ai{background:var(--ai-bg);color:var(--ai)}
.pill.fact{background:var(--fact-bg);color:var(--fact)}
.spec{display:inline-block;font-size:11px;color:var(--spec);border:1px dashed var(--spec);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle;font-weight:400;white-space:nowrap}
.no-annot .spec,.no-annot .spec-note{display:none!important}
.spec-note{border-left:2px dashed var(--spec);padding:6px 10px;margin:10px 0;font-size:12.5px;color:var(--muted);background:var(--surface)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:18px}
.stack>*+*{margin-top:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.sticky{position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}
.banner{padding:10px 14px;border-radius:6px;background:var(--surface-2);margin-bottom:14px}
.banner.warn{background:var(--stale-bg);color:var(--stale)}
.banner.bad{background:var(--block-bg);color:var(--block)}
.banner.ok{background:var(--sign-bg);color:var(--sign)}
.banner.ai{background:var(--ai-bg);color:var(--ai)}
.banner .btn{margin-left:8px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0}
.empty{padding:40px;text-align:center;background:var(--surface);border:1px dashed var(--rule);border-radius:8px}

/* Tables */
.scroll{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;background:var(--surface)}
.tbl th{font-weight:500;color:var(--muted);text-align:left;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr.sub td{border-bottom-style:dashed}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:var(--surface-2)}
.tbl tr.new td{background:var(--ins)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.docTbl{font-family:"Source Serif 4",Georgia,serif;font-size:14px}
.docTbl th{font-family:"IBM Plex Sans",sans-serif}

/* Home */
.summary{font-size:16px;margin:0 0 18px;max-width:72ch}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.path{border-top:3px solid var(--ink);background:var(--surface);padding:16px;border-radius:0 0 8px 8px;border-left:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.path.v2{border-top-color:var(--ai)}
.path ol{padding-left:20px;margin:8px 0 14px}
.path li{margin-bottom:4px}
.cname{font-weight:500}
.deleg{font-size:12px;color:var(--stale)}

/* Inbox */
.item{display:grid;grid-template-columns:8px 150px minmax(0,1fr) 150px 110px auto;gap:14px;align-items:center;background:var(--surface);border-bottom:1px solid var(--rule);padding:12px 14px}
.item:first-child{border-radius:8px 8px 0 0}
.item:last-child{border-radius:0 0 8px 8px;border-bottom:0}
.urg{width:8px;height:32px;border-radius:2px;background:var(--rule)}
.urg.high{background:var(--block)}
.urg.normal{background:var(--fact)}
.list{border:1px solid var(--rule);border-radius:8px}
.filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}

/* Change header and trail */
.chg{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:8px;font-size:13px}
.meta span b{font-weight:500;color:var(--muted);margin-right:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:16px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab.on{border-bottom-color:var(--ink);font-weight:600}
.trail{display:flex;list-style:none;padding:0;margin:0;gap:0;flex-wrap:wrap;font-size:12.5px}
.trail li{padding:3px 12px 3px 18px;position:relative;color:var(--muted)}
.trail li::before{content:"";position:absolute;left:5px;top:50%;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted);transform:translateY(-50%)}
.trail li.done{color:var(--sign)}
.trail li.done::before{background:var(--sign);border-color:var(--sign)}
.trail li.cur{color:var(--ink);font-weight:600}
.trail li.cur::before{background:var(--ink);border-color:var(--ink)}

/* Locations */
.node{margin:22px 0 8px;font-size:13px;color:var(--muted);font-weight:500}
.loc{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--stale);border-radius:0 8px 8px 0;padding:14px 16px;margin-bottom:10px}
.loc.edited{border-left-color:var(--sign)}
.loc.no_edit{border-left-color:var(--muted)}
.loc-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
.why{font-size:12.5px;color:var(--muted);margin-top:2px}
.loc-state{display:flex;gap:6px;align-items:center;flex-shrink:0}
.toolbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.menu-wrap{position:relative}
.menu{display:none;position:absolute;z-index:10;top:calc(100% + 4px);left:0;background:var(--surface);border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(10,20,40,.18);min-width:290px;padding:6px}
.menu.open{display:block}
.menu button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:7px 9px;border-radius:5px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-2)}
.doc{font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.65;max-width:72ch}
.editor{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--surface)}
.editor[contenteditable="true"]{background:var(--bg)}
.editor[contenteditable="true"]:focus{outline:2px solid var(--focus);outline-offset:0}
.fref{color:var(--fact);background:var(--fact-bg);border-radius:3px;padding:0 3px;border-bottom:1px dotted var(--fact);white-space:nowrap}
.fref.new{box-shadow:inset 0 0 0 1px var(--fact)}
.diff ins{background:var(--ins);text-decoration:none;border-radius:2px}
.diff del{background:var(--del);border-radius:2px}
.ba{display:grid;grid-template-columns:90px 1fr;gap:4px 12px;font-size:13.5px}
.ba dt{color:var(--muted)}
.ba dd{margin:0}
.noedit{background:var(--surface-2);border-radius:6px;padding:10px 12px}
.submitbar{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--bg);border-top:1px solid var(--rule);padding:12px 0;margin-top:20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.blockers{margin:0;padding-left:18px;color:var(--stale);font-size:13px}

/* Review side */
.side h3{margin:16px 0 6px}
.side h3:first-child{margin-top:0}
.src{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;background:var(--surface-2);border-radius:6px;margin-bottom:6px;cursor:pointer;border:0;width:100%;text-align:left}
.radio{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}

/* Release */
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps>li{counter-increment:s;position:relative;padding:16px 18px 16px 58px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;margin-bottom:12px}
.steps>li::before{content:counter(s);position:absolute;left:18px;top:15px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:600;font-size:13px}
.steps>li.done::before{background:var(--sign);color:#fff}
.check{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--rule);font-size:13.5px}
.check:last-child{border-bottom:0}
.preview{position:relative;overflow:hidden;border:1px solid var(--rule);border-radius:6px;padding:26px 30px;background:var(--surface);margin-top:12px}
.preview::after{content:"Draft, not approved";position:absolute;inset:0;display:grid;place-items:center;font:600 42px "IBM Plex Sans",sans-serif;color:var(--block);opacity:.08;transform:rotate(-18deg);pointer-events:none}
.preview h4{font:600 15px "IBM Plex Sans",sans-serif;margin:18px 0 6px}
.manifest{border:2px solid var(--sign);border-radius:8px;padding:18px 20px;background:var(--surface)}
.manifest h2{color:var(--sign)}

/* Proposal */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.srcdoc{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:26px 30px;max-height:calc(100dvh - 180px);overflow:auto}
.srcdoc h4{font:600 17px "Source Serif 4",Georgia,serif;margin:0 0 12px}
.srcdoc p{margin:0 0 12px}
.srcdoc mark{background:var(--ai-bg);color:inherit;border-radius:2px;padding:0 1px}
.srcdoc mark.active{outline:2px solid var(--ai);background:var(--ai-bg)}
.srcdoc.plain mark{background:none;outline:none}
.field{border-bottom:1px solid var(--rule);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.field:last-child{border-bottom:0}
.field input{width:100%}
.conf{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar{width:70px;height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sign)}
.bar i.low{background:var(--stale)}
.link{background:none;border:0;padding:0;color:var(--fact);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:12.5px}

/* Modal and toast */
.modal-back{position:fixed;inset:0;background:rgba(10,16,28,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--surface);border-radius:10px;max-width:560px;width:100%;padding:22px 24px;max-height:calc(100% - 40px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:780px}
.modal .fld{margin:12px 0}
.modal .fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.modal .fld input{width:100%}
.prog{list-style:none;padding:0;margin:12px 0 0}
.prog li{padding:5px 0 5px 26px;position:relative;color:var(--muted)}
.prog li::before{content:"";position:absolute;left:4px;top:11px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}
.prog li.done{color:var(--ink)}
.prog li.done::before{background:var(--sign);border-color:var(--sign)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--btn-bg);color:var(--btn-ink);padding:10px 16px;border-radius:8px;max-width:min(560px,90vw);z-index:60;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{display:block}

/* Forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.form input,.form select{width:100%}
.types{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px;max-height:calc(100dvh - 160px);overflow:auto}
.types .g{font-size:12px;color:var(--muted);margin:10px 8px 4px}
.types button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:5px;cursor:pointer}
.types button:hover{background:var(--surface-2)}
.types button.on{background:var(--fact-bg);color:var(--fact)}
.types button span{color:var(--muted);font-size:12px;min-width:40px}
.logcols{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}

@media (max-width:1000px){.grid2,.split,.logcols{grid-template-columns:1fr}.sticky{position:static}.srcdoc{max-height:none}.types{max-height:260px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;display:flex;gap:6px;overflow-x:auto;padding:10px 12px}
  .brand,.navg{display:none}
  .nav{display:flex;gap:4px}
  .nav button{white-space:nowrap;width:auto}
  #view{padding:18px 16px 60px}
  .top{padding:10px 16px}
  .paths,.form{grid-template-columns:1fr}
  .item{grid-template-columns:8px 1fr;row-gap:4px}
  .item>*:nth-child(n+3){grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand"><b>PSMF Platform</b><span>Meridian PV Services</span></div>
    <div id="nav"></div>
  </nav>
  <div class="main">
    <header class="top" id="top"></header>
    <main id="view"></main>
  </div>
</div>
<div id="modal"></div>
<div id="toast" role="status"></div>

<script>
/* ---------- Constants and sample data ---------- */
const TODAY = '2026-09-29';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const USERS = {
  author:{name:'Tomasz Nowak', role:'PSMF author', init:'TN'},
  qppv:{name:'Anna Weber', role:'QPPV', init:'AW'},
  deputy:{name:'Eva Lindqvist', role:'Deputy QPPV', init:'EL'}
};
const CLIENTS0 = [
  {id:'hal', name:'Halvorsen Pharma A/S', psmfs:[{v:'EU',ver:'4.0',date:'2026-03-12'},{v:'UK',ver:'3.0',date:'2026-03-12'}]},
  {id:'brw', name:'Brightwell Therapeutics Ltd', psmfs:[{v:'EU',ver:'7.0',date:'2026-06-30'},{v:'UK',ver:'5.0',date:'2026-06-30'}]},
  {id:'cor', name:'Corvena Biologics GmbH', psmfs:[{v:'EU',ver:'2.0',date:'2025-11-04'}], delegation:'Deputy acting until 9 Oct'},

  const out = STATIC_ITEMS.slice();
  S.sets.forEach(s=>{
    if(s.state==='Submitted') out.push({id:s.id,kind:'change_set_approval',client:s.client,psmf:s.psmf,title:`${S.change.title}`,urg:'normal',to:'review:'+s.psmf,roles:['qppv']});
    if(s.state==='Rejected' || (s.state==='InPreparation' && s.returned)) out.push({id:s.id+'-r',kind:'change_set_returned',client:s.client,psmf:s.psmf,title:`${S.change.title}: ${s.returned||'rejected'}`,urg:'normal',to:'impact:'+s.psmf,roles:['author']});
  });
  S.intake.filter(m=>!m.done).forEach(m=>out.push({id:m.id,kind:'intake',client:m.client,psmf:null,title:`${m.subject} (${m.level.toLowerCase()} level)`,urg:'normal',to:m.act==='proposal'?'proposal':'intake',roles:ALL,v2:true}));
  S.quarantine.filter(q=>!q.done).forEach(q=>out.push({id:q.id,kind:'quarantine',client:q.client,psmf:null,title:`${q.from}: ${q.subject}`,urg:'normal',to:'intake:q',roles:ALL,v2:true}));
  const rank={high:0,normal:1,low:2};
  const r = roleFilter ? out.filter(i=>i.roles.includes(roleFilter)) : out;
  return r.sort((a,b)=>rank[a.urg]-rank[b.urg] || (a.due||'9').localeCompare(b.due||'9'));
}

/* ---------- Word diff ---------- */
function tokens(html){
  const d=document.createElement('div'); d.innerHTML=html; const out=[];
  const pushText=t=>t.split(/(\s+)/).forEach(x=>{ if(x) out.push({t:x,c:false}); });
  d.childNodes.forEach(n=>{
    if(n.nodeType===3) pushText(n.textContent);
    else if(n.classList && n.classList.contains('fref')) out.push({t:n.textContent,c:true,n:n.classList.contains('new')});
    else pushText(n.textContent||'');
  });
  return out;
}
function diff(a,b){
  const A=tokens(a),B=tokens(b),m=A.length,n=B.length,key=x=>(x.c?'§':'')+x.t.replace(/\s+/g,' ');
  const L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) L[i][j]= key(A[i])===key(B[j]) ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const r=x=>x.c?`<span class="fref${x.n?' new':''}">${esc(x.t)}</span>`:esc(x.t);
  let i=0,j=0,h='';
  while(i<m&&j<n){ if(key(A[i])===key(B[j])){h+=r(A[i]);i++;j++;} else if(L[i+1][j]>=L[i][j+1]){h+=`<del>${r(A[i])}</del>`;i++;} else {h+=`<ins>${r(B[j])}</ins>`;j++;} }
  while(i<m) h+=`<del>${r(A[i++])}</del>`; while(j<n) h+=`<ins>${r(B[j++])}</ins>`;
  return h;
}

  if(active && S.role==='deputy') perm = `<div class="banner warn">Eva has no active delegation for Halvorsen Pharma, so she has author-level rights here (P-04). The QPPV can delegate, or Eva can declare an emergency delegation with a reason.</div>`;

  const locs = set.locs.map(l=>{

  const lb = set.logbook; const lbEdit = can && active;

    <textarea data-bind="lbSummary" aria-label="Logbook summary" ${lbEdit?'':'disabled'}>${esc(lb.summary)}</textarea>
    <textarea data-bind="lbReason" aria-label="Logbook reason" style="margin-top:6px" ${lbEdit?'':'disabled'}>${esc(lb.reason)}</textarea>
    <label class="radio"><input type="radio" name="sig" data-change="lbSig" value="significant" ${lb.significance==='significant'?'checked':''} ${lbEdit?'':'disabled'}><span>Significant: goes into Annex I</span></label>

    ${lb.significance==='not'?`<input type="text" data-bind="lbNs" placeholder="Reason" value="${esc(lb.nsReason)}" style="width:100%" ${lbEdit?'':'disabled'}>`:''}

  </div>`;
  return `${changeHeader()}${setTabs()}
  <div class="row" style="justify-content:space-between;margin-bottom:12px">${trail(set.state)}<span>${tag('SC-14','UC-11')}</span></div>

let saved = null;
function refreshLoc(lid){
  const set=curSet(), l=set.locs.find(x=>x.id===lid); if(!l) return;
  const st=document.getElementById('st-'+lid); if(st) st.innerHTML=statusPill(l);
  const or=document.getElementById('or-'+lid); if(or) or.innerHTML=originBadge(l.origin);
  const el=document.getElementById('loc-'+lid); if(el) el.className='loc '+l.status;
  const sb=document.getElementById('submitbar'); if(sb) sb.innerHTML=submitBar(set);
}
function onEdit(lid, ed){
  const set=curSet(); const l=set.locs.find(x=>x.id===lid); if(!l) return;
  l.after = ed.innerHTML;
  const changed = tokens(l.after).map(t=>t.t).join('').replace(/\s+/g,' ').trim() !== tokens(l.before).map(t=>t.t).join('').replace(/\s+/g,' ').trim();
  l.status = changed ? 'edited' : 'to_edit';
  if(changed){ if(l.origin==='ai') l.origin='ai_edited'; else if(!l.origin) l.origin='human'; }
  refreshLoc(lid);
}

  insertFact:(arg)=>{
    const [lid,fid]=arg.split('|'); const ed=document.querySelector(`[data-editor="${lid}"]`); if(!ed) return;
    const f=FACTS[fid]; const span=document.createElement('span'); span.className='fref'+(f.isNew?' new':''); span.contentEditable='false'; span.dataset.fact=fid; span.textContent=f.label;
    const sp=document.createTextNode(' ');
    if(saved && saved.id===lid && ed.contains(saved.range.startContainer)){ const r=saved.range; r.deleteContents(); r.insertNode(sp); r.insertNode(span); r.setStartAfter(sp); r.collapse(true); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    else { ed.appendChild(document.createTextNode(' ')); ed.appendChild(span); }
    document.getElementById('menu-'+lid).classList.remove('open'); onEdit(lid,ed);
  },
  noEditOpen:(lid)=>{ const r=document.getElementById('ne-'+lid); r.hidden=!r.hidden; if(!r.hidden) document.getElementById('ner-'+lid).focus(); },
  noEditConfirm:(lid)=>{ const v=document.getElementById('ner-'+lid).value.trim(); if(!v) return toast('Give a reason. It is recorded with the change set (BR-23).'); const l=curSet().locs.find(x=>x.id===lid); l.status='no_edit'; l.reason=v; if(!l.origin) l.origin='human'; else if(l.origin==='ai') l.origin='ai_edited'; render(); },
  undoNoEdit:(lid)=>{ const l=curSet().locs.find(x=>x.id===lid); l.status= (l.kind==='table' && S.change.fields.contractRef) ? 'edited' : 'to_edit'; l.reason=''; render(); },
  resetLoc:(lid)=>{ const l=curSet().locs.find(x=>x.id===lid); l.after=l.before; l.status='to_edit'; l.origin=null; render(); },
  submitSet:()=>{ const set=curSet(); if(blockers(set).length) return; set.state='Submitted'; set.returned=null; set.submittedAt=nowUTC(); render(); toast(`${set.id} submitted. It is now in Anna Weber's inbox.`); },
  reviseSet:()=>{ const s=curSet(); s.state='InPreparation'; render(); },
  withdrawSet:()=>{ const s=curSet(); s.state='Withdrawn'; render(); toast('Withdrawn with the rejection reason kept (BR-25).'); },
  approve:()=>{ const s=curSet(); const lb=s.logbook; if(lb.significance==='not' && !lb.nsReason.trim()) return toast('Give a reason for marking the logbook entry not significant (BR-46).'); s.state='Approved'; s.approvedBy='Anna Weber, QPPV'; s.approvedAt=nowUTC(); lb.status='approved'; render(); toast(`Approved. The edits are now in the ${s.psmf} PSMF draft; no version yet.`); },
  requestChanges:()=>{ modal(`<h2>Request changes</h2><p class="muted">The change set goes back to the author as in preparation.</p><div class="fld"><label for="rc">Comment</label><input id="rc" type="text" value="Please name the territories (Sweden, Norway, Finland) in 2.4."></div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="rcConfirm">Send back</button></div>`); },
  rcConfirm:()=>{ const v=document.getElementById('rc').value.trim()||'Changes requested'; const s=curSet(); s.state='InPreparation'; s.returned=v; closeModal(); render(); toast('Sent back to Tomasz.'); },
  reject:()=>{ modal(`<h2>Reject change set</h2><p class="muted">Rejection does not delete the change set. The author can revise or withdraw it (BR-25).</p><div class="fld"><label for="rj">Reason</label><input id="rj" type="text" placeholder="Required"></div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="rjConfirm">Reject</button></div>`); },
  rjConfirm:()=>{ const v=document.getElementById('rj').value.trim(); if(!v) return toast('A reason is required.'); const s=curSet(); s.state='Rejected'; s.rejectReason=v; closeModal(); render(); },
  openDoc:(name)=>{ const s=(S.change&&S.change.sources.find(x=>x.name===name))||{name,sha:fakeHash(name)}; modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(name)}</h2><button class="btn sm" data-act="closeModal">Close</button></div>
    <dl class="kv small" style="margin:10px 0"><dt>Channel</dt><dd>${esc(s.channel||'upload')}</dd><dt>Sender</dt><dd>${esc(s.sender||'')}</dd><dt>Hash</dt><dd class="mono">sha256 ${s.sha}</dd></dl>
    ${name.startsWith('SDEA')?`<div class="srcdoc doc plain" style="max-height:none">${SDEA_DOC}</div>`:`<div class="empty small">Distribution agreement DA-2026-03 between Halvorsen Pharma A/S and Nordica Distribution AB, 14 pages. Rendering of this sample file is not included.</div>`}`, true); },
  runChecks:()=>{ const v=S.tab; S.rel[v].checks=null; modal(`<h2>Running consistency checks</h2><ul class="prog" id="prog"><li>Fact references resolve</li><li>Required locations filled</li><li>No ended fact still referenced</li><li>Same fact consistent across locations</li><li>QPPV and deputy users match section 1</li><li>Annex and SOP cross-references exist</li></ul>`);
    const lis=document.querySelectorAll('#prog li'); let i=0; const t=setInterval(()=>{ if(i<lis.length){lis[i].classList.add('done');i++;} else { clearInterval(t); closeModal();
      S.rel[v].checks=[{n:'Fact references resolve',r:'pass'},{n:'Required locations filled',r:'pass'},{n:'No ended fact still referenced',r:'warn',d:'5.4 references SOP-PV-007 version 3, which ends on 30 Sep 2026. It renders its last value until the SOP change is logged.'},{n:'Same fact consistent across locations',r:'pass',d:'Nordica Distribution AB appears in 2.4, Annex B and Annex C with the same value.'},{n:'QPPV and deputy users match section 1 (BR-41)',r:'pass'},{n:'Annex and SOP cross-references exist',r:'pass'}];
      render(); } },170); },
  togglePreview:()=>{ const r=S.rel[S.tab]; r.preview=!r.preview; render(); },
  signOpen:()=>{ const p=psmfOf('hal',S.tab); const nv=(parseInt(p.ver,10)+1)+'.0';
    modal(`<h2>Sign version ${nv} of the ${S.tab} PSMF</h2>
    <p class="muted">You are signing as Anna Weber, QPPV. The signature binds your identity, the meaning below and the time to the hash of the frozen content.</p>
    <dl class="kv"><dt>Meaning</dt><dd>Approved for release</dd><dt>Effective date</dt><dd>${fmt(S.rel[S.tab].eff)}</dd></dl>
    <div class="fld"><label for="pw">Password</label><input id="pw" type="password" autocomplete="off"></div>
    <div class="fld"><label for="otp">Authenticator code</label><input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="6 digits"></div>
    <p class="small muted">Any password and any 6 digits work in the prototype.</p>
    <div class="row" style="justify-content:space-between;margin-top:14px"><button class="link" data-act="wetOpen">Sign on paper instead</button><div class="row"><button class="btn" data-act="closeModal">Cancel</button><button class="btn sign" data-act="signConfirm">Sign and release</button></div></div>`); },
  wetOpen:()=>{ modal(`<h2>Sign on paper</h2><p>Download the signature page, sign it, scan it and upload the scan. The version is created when the upload is saved; until then the release waits for a signature (BR-37).</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn" data-act="toastOnly" data-arg="Signature page not generated in the prototype.">Download signature page</button><button class="btn sign" data-act="doSign" data-arg="wet">Upload scanned page (sample)</button></div>`); },
  signConfirm:()=>{ const pw=document.getElementById('pw').value, otp=document.getElementById('otp').value.trim(); if(!pw || !/^\d{6}$/.test(otp)) return toast('Re-authentication failed. Nothing was released. Enter a password and a 6-digit code.'); ACT.doSign('electronic'); },
  doSign:(kind)=>{
    const v=S.tab; const p=psmfOf('hal',v); const nv=(parseInt(p.ver,10)+1)+'.0';
    modal(`<h2>Releasing version ${nv}</h2><ul class="prog" id="prog"><li>Recording signature and re-authentication event</li><li>Freezing the draft into an immutable content state</li><li>Rendering PDF/A-2b with bookmarks and signature page</li><li>Storing output hash with object lock</li><li>Opening a new draft</li></ul>`);
    const lis=document.querySelectorAll('#prog li'); let i=0; const t=setInterval(()=>{ if(i<lis.length){lis[i].classList.add('done');i++;} else { clearInterval(t); closeModal();
      const sets=S.sets.filter(s=>s.psmf===v && s.state==='Approved');
      sets.forEach(s=>{ s.state='Released'; s.releasedIn=nv; });
      S.released[v]={ver:nv, at:nowUTC(), eff:S.rel[v].eff, signer:'Anna Weber, QPPV', kind, hash:fakeHash(S.change.id+v+nv), reauth:'RA-'+fakeHash(nowUTC()).slice(0,10), logbook:sets[0].logbook};
      p.ver=nv; p.date=TODAY; S.rel[v]={checks:null,eff:TODAY,preview:false};
      render(); window.scrollTo(0,0); toast(`Version ${nv} released and signed.`); } },260);
  },
  openIntake:(id)=>{ const m=S.intake.find(x=>x.id===id); if(m.act==='proposal') return go('proposal'); if(m.act==='draft') return go('stub:draftitem'); m.done=true; render(); toast('Stored as a source document. Manual level creates no proposal (P-11).'); },
  qRelease:(id)=>{ const q=S.quarantine.find(x=>x.id===id); q.done=true; S.intake.unshift({id:q.id,from:q.from,addr:q.from,client:q.client,subject:q.subject,files:q.files,at:q.at,spf:q.spf,dkim:q.dkim,level:'Draft',status:'Released, awaiting classification',act:'draft'}); render(); toast('Released. It is processed like any intake message; the sender stays off the allowlist.'); },
  qAllow:(id)=>{ ACT.qRelease(id); toast('Released, and the sender was added to the Halvorsen allowlist.'); },
  qReject:(id)=>{ const q=S.quarantine.find(x=>x.id===id); q.done=true; render(); toast('Rejected. The decision is in the audit trail.'); },
  showP:(p)=>{ S.activeP=p; document.querySelectorAll('#srcdoc mark').forEach(m=>m.classList.toggle('active',m.dataset.p===p)); const m=document.querySelector(`#srcdoc mark[data-p="${p}"]`); if(m) m.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); },
  pAccept:(i)=>{ const f=S.prop[+i]; f.state = f.value!==f.orig ? 'edited' : 'accepted'; render(); },
  pReject:(i)=>{ S.prop[+i].state='rejected'; render(); },
  pUndo:(i)=>{ const f=S.prop[+i]; f.state='pending'; render(); },
  useProposal:()=>{
    const F={}; S.prop.forEach(f=>{ if(f.state!=='rejected') F[f.k]=f.value; });
    F.contractRef=null;
    createChange(F, F.contractDate, [{name:'SDEA-HAL-017_signed.pdf', size:'412 KB', sender:'k.dahl@halvorsen.dk', channel:'intake_email', sha:fakeHash('SDEA-HAL-017_signed.pdf')}], 'ai');
    S.propUsed=true; const m=S.intake.find(x=>x.id==='M-1041'); if(m) m.done=true;
    S.role='author';
    impactModal(()=>{ go('impact'); toast('Change sets drafted by AI. Check the violet badges, then submit.'); }, true);
  }
};
const BIND = {
  logField:(v,el)=>{ S.log.fields[el.dataset.f]=v; updateSave(); },
  lbSummary:(v)=>{ curSet().logbook.summary=v; if(curSet().logbook.origin==='ai') curSet().logbook.origin='ai_edited'; },
  lbReason:(v)=>{ const lb=curSet().logbook; lb.reason=v; if(lb.origin==='ai') lb.origin='ai_edited'; const sb=document.getElementById('submitbar'); if(sb) sb.innerHTML=submitBar(curSet()); const lc=document.getElementById('loc-logbook'); if(lc) lc.className='loc '+(v.trim()?'edited':''); },
  lbNs:(v)=>{ curSet().logbook.nsReason=v; },
  contractRef:(v)=>{ S.change.fields.contractRef=v.trim()||null; const l=curSet().locs.find(x=>x.id==='annB'); l.status=v.trim()?'edited':'to_edit'; l.origin=l.origin==='ai'?'ai_edited':l.origin; refreshLoc('annB'); },
  propField:(v,el)=>{ const f=S.prop[+el.dataset.i]; f.value=v; if(f.state==='accepted' && v!==f.orig){ f.state='edited'; document.getElementById('pst-'+el.dataset.i).innerHTML='<span class="pill ai">Edited by human</span>'; } }
};
const CHG = {
  role:(v)=>{ S.role=v; render(); toast(`Now acting as ${USERS[v].name}, ${USERS[v].role}.`); },
  annot:(v,el)=>{ S.annot=el.checked; document.body.classList.toggle('no-annot',!S.annot); },
  inboxClient:(v)=>{ S.inboxF={...(S.inboxF||{}),client:v}; render(); },
  inboxKind:(v)=>{ S.inboxF={...(S.inboxF||{}),kind:v}; render(); },
  logSel:(v,el)=>{ S.log.fields[el.dataset.f]=v; },
  logEvent:(v)=>{ S.log.event=v; render(); },
  lbSig:(v)=>{ curSet().logbook.significance=v; render(); },
  effDate:(v)=>{ if(v<TODAY){ toast('The effective date cannot be before the signature date (BR-38).'); render(); return; } S.rel[S.tab].eff=v; },
  autoLevel:(v,el)=>{ const a=S.auto[+el.dataset.i]; a.level=v; toast(`${a.ct} set to ${v.replace('_','-')} for documents received from now on.`); }
};
function updateSave(){ const b=document.getElementById('saveChange'); if(!b) return; const L=S.log; const ok=L.fields.name && L.event && L.sources.length; b.disabled=!ok; const h=document.getElementById('saveHint'); if(h) h.textContent=ok?'':'Needs a partner name, an event date and at least one source.'; }

/* ---------- Events ---------- */
document.addEventListener('mousedown',e=>{ if(e.target.closest('.menu button,[data-act="factMenu"]')) e.preventDefault(); });
document.addEventListener('click',e=>{
  if(!e.target.closest('.menu-wrap')) document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  const t=e.target.closest('[data-act]'); if(!t || t.disabled) return;
  const f=ACT[t.dataset.act]; if(!f) return;
  if(t.dataset.act==='modalBack' && e.target!==t) return;
  e.preventDefault(); f(t.dataset.arg,t,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset && t.dataset.editor) return onEdit(t.dataset.editor,t);
  if(t.dataset && t.dataset.bind && BIND[t.dataset.bind]) BIND[t.dataset.bind](t.value,t);
});
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset && t.dataset.change && CHG[t.dataset.change]) CHG[t.dataset.change](t.value,t); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.addEventListener('selectionchange',()=>{
  const sel=getSelection(); if(!sel.rangeCount) return; const r=sel.getRangeAt(0);
  const node=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;
  const ed=node && node.closest ? node.closest('[data-editor]') : null;
  if(ed) saved={id:ed.dataset.editor, range:r.cloneRange()};
});
render();
</script>
</body>
