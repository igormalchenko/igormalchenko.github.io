const BASE=[
{id:"s1",title:"1. QPPV and deputy",p:["1.1 The QPPV is Anna Weber, MD, employed by Meridian PV Services ApS and resident in Copenhagen, Denmark. She is reachable 24 hours a day on +45 70 20 41 18. Her CV and job description are in Annex A.","1.2 The deputy QPPV is Lars Eriksen, MSc Pharm, Meridian PV Services ApS, who acts in the QPPV's absence under a recorded delegation."]},
{id:"s2",title:"2. Organisational structure",p:["2.1 Halvorsen Pharma A/S holds the marketing authorisations listed in Annex H. Pharmacovigilance activities are delegated to Meridian PV Services ApS under service agreement MSA-HAL-2019-02.","2.2 Oracle hosts the safety database. Kestrel Audit Partners Ltd performs independent audits. Service providers and contracts are listed in Annex B.","2.3 Products are distributed by Medivo GmbH (Germany, Austria), Baltrex UAB (Lithuania, Latvia, Estonia) and Iberfarma S.L. (Spain, Portugal, licensing partner)."]},
{id:"s3",title:"3. Sources of safety data",p:["3.1 Safety reports reach Halvorsen through the medical information line, the website contact form, weekly literature screening, EudraVigilance and partners.","3.2 Partners forward reports under safety data exchange agreements with Medivo GmbH, Baltrex UAB and Iberfarma S.L. All sources and agreements are listed in Annex C."]},
{id:"s4",title:"4. Computerised systems",p:["4.1 Cases are processed in Oracle Argus Safety 8.4.2, hosted by Oracle in Frankfurt and validated in November 2025. Events are coded with MedDRA version 29.0.","4.2 Controlled documents are held in Veeva QualityDocs. All systems are listed in Annex D."]},
{id:"s5",title:"5. Pharmacovigilance processes",p:["5.1 Individual case reports are handled under SOP-PV-003 (Case processing) and SOP-PV-004 (Expedited reporting), including electronic submission to EudraVigilance.","5.2 Literature is screened weekly under SOP-PV-005. Signals are managed under SOP-PV-006 and periodic safety reports under SOP-PV-007. All procedures are listed in Annex E."]},
{id:"s6",title:"6. PV system performance",p:["6.1 Timeliness of reporting is measured quarterly from Argus data. In Q2 2026, 97.6% of serious reports were submitted within 15 days. Figures are given in Annex F."]},
{id:"s7",title:"7. Quality system",p:["7.1 Procedures are controlled under SOP-PV-001 and staff training under SOP-PV-011. The most recent audit was the vendor audit of Meridian PV Services in November 2025. Audits and corrective actions are listed in Annex G."]},
{id:"aA",title:"Annex A. QPPV and deputy",cols:["Role","Name","Qualification","Location","Since"],rows:[["QPPV","Anna Weber","MD","Copenhagen, DK","1 Jan 2023"],["Deputy QPPV","Lars Eriksen","MSc Pharm","Aarhus, DK","1 Apr 2024"]]},
{id:"aB",title:"Annex B. Service providers and partners",cols:["Organisation","Role","Countries","Contract"],rows:[["Meridian PV Services ApS","PV service provider and QPPV","EU/EEA","MSA-HAL-2019-02"],["Oracle Deutschland B.V.","Safety database hosting","EU","ORA-2021-1187"],["Kestrel Audit Partners Ltd","Independent audits","EU","KAP-2024-07"],["Medivo GmbH","Distributor","DE, AT","DIST-HAL-2020-03"],["Baltrex UAB","Distributor","LT, LV, EE","DIST-HAL-2022-01"],["Iberfarma S.L.","Licensing partner","ES, PT","LIC-HAL-2023-02"]]},
{id:"aC",title:"Annex C. Sources of safety data and agreements",cols:["Source","Agreement","Reconciliation"],rows:[["Medical information line","None","n/a"],["Website contact form","None","n/a"],["Literature, global and local","None","Weekly"],["EudraVigilance (EVDAS)","None","Monthly"],["Medivo GmbH","SDEA-HAL-011","Quarterly"],["Baltrex UAB","SDEA-HAL-014","Quarterly"],["Iberfarma S.L.","SDEA-HAL-016","Quarterly"]]},
{id:"aD",title:"Annex D. Computerised systems",cols:["System","Version","Use","Validated"],rows:[["Oracle Argus Safety","8.4.2","Case processing","Nov 2025"],["MedDRA","29.0","Event coding","n/a"],["Veeva QualityDocs","25R3","Controlled documents","Jun 2025"],["Biologit MLM-AI","2026.2","Literature screening","Feb 2026"]]},
{id:"aE",title:"Annex E. Procedures (SOPs)",cols:["SOP","Title","Version","Effective"],rows:[["SOP-PV-001","PSMF maintenance","3.0","Jan 2026"],["SOP-PV-002","Adverse event intake","4.1","Oct 2025"],["SOP-PV-003","Case processing","5.0","Mar 2025"],["SOP-PV-004","Expedited reporting","2.2","Mar 2025"],["SOP-PV-005","Literature screening","3.0","Feb 2026"],["SOP-PV-006","Signal management","2.0","Jun 2025"],["SOP-PV-007","Periodic safety reports","2.1","Sep 2025"],["SOP-PV-008","SDEA management","1.3","Nov 2025"],["SOP-PV-009","QPPV oversight","1.1","Jan 2026"],["SOP-PV-011","Training","2.0","Apr 2025"],["SOP-PV-012","Deviations and CAPA","1.4","Dec 2025"]]},
{id:"aF",title:"Annex F. Performance",cols:["Quarter","Reports submitted","Serious on time (15 days)","Non-serious on time (90 days)"],rows:[["Q3 2025","371","96.8%","100%"],["Q4 2025","388","97.1%","99.7%"],["Q1 2026","402","96.9%","100%"],["Q2 2026","395","97.6%","100%"]]},

 <div class="sect"><h2>Current contents</h2><div class="card facts">${facts.map(f=>`<button class="fact" onclick="go('sign','#${f[2]}')"><span class="fk">${f[0]}</span><span class="fv">${esc(f[1])}</span></button>`).join("")}</div></div></div>`}
const ICO={app:'<path d="M3 8.5l3 3 7-7"/>',esc:'<path d="M8 2.5l6 11H2z"/><path d="M8 7v2.5"/><path d="M8 11.8v.1"/>',none:'<path d="M4 8h8"/>',irr:'<circle cx="8" cy="8" r="5.5"/><path d="M4.2 11.8l7.6-7.6"/>',appr:'<path d="M3 8.5l3 3 7-7"/>',rej:'<path d="M4 4l8 8M12 4l-8 8"/>',ovr:'<path d="M10.5 3l2.5 2.5L6 12.5H3.5V10z"/>',rev:'<path d="M4 6h6a3 3 0 010 6H7"/><path d="M6 3.5L3.5 6 6 8.5"/>'};
const TIP={app:"Applied to the draft automatically",esc:"The system could not settle this. It needs your decision",none:"Received. Nothing in the PSMF changed",irr:"Not about the PSMF. Ignored",appr:"You approved this",rej:"You rejected this",ovr:"You changed what the system applied",rev:"You took this change out of the draft"};
function outPill(l){const o=OUT[l.out];let tip=TIP[l.out];const t=l.ref&&chBy(l.ref);
 if(l.out==="esc"&&t&&t.status!=="open")tip="Escalated. You have decided it";
 return `<span class="op ${l.out==="esc"&&t&&t.status==="open"?"flag":""}" title="${tip}"><svg viewBox="0 0 16 16" aria-hidden="true">${ICO[l.out]}</svg>${o[1]}</span>`}
function logTable(rows,showSrc){return `<div class="list scroll"><table><thead><tr><th>Date</th>${showSrc?"<th>Source</th>":""}<th>Received</th><th>From</th><th>Outcome</th></tr></thead><tbody>${rows.map(l=>{const o=OUT[l.out];const tgt=l.ref&&chBy(l.ref);return `<tr class="${tgt?"click":""}" ${tgt?`onclick="go('${tgt.kind==="esc"?"esc":"upd"}','${l.ref}')"`:""}><td style="white-space:nowrap">${esc(l.d)}</td>${showSrc?`<td class="sm">${l.src==="you"?"You":esc(srcBy(l.src).name)}</td>`:""}<td>${esc(l.item)}</td><td class="sm mute">${esc(l.from)}</td><td>${outPill(l)}</td></tr>`}).join("")}</tbody></table></div>`}
function escs(){const all=CH.filter(c=>c.kind==="esc"),open=all.filter(c=>c.status==="open"),done=all.filter(c=>c.status!=="open");
 return `<h1 style="margin-bottom:20px">Escalations</h1>
 ${open.length?open.map(c=>escCard(c,false)).join(""):`<div class="card">No open escalations. <button class="btn s primary" onclick="go('sign')">Review and sign</button></div>`}
 ${done.length?`<h2 class="sect">Decided</h2>${done.map(c=>escCard(c,false)).join("")}`:""}`}
function excerpts(c){const was=c.status;if(was!=="approved")c.status="approved";const doc=buildDoc();c.status=was;
 const locs=[...new Set(c.edits.map(e=>e.loc))];const tag=`data-c="${c.id}"`;
 return locs.map(id=>{const s=doc.find(x=>x.id===id);let body;
  if(s.p){const ps=s.p.filter(p=>p.includes(tag));body=(ps.length?ps:s.p).map(p=>`<p>${p}</p>`).join("")}
  else body=`<div class="scroll"><table><thead><tr>${s.cols.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${s.rows.map(r=>`<tr class="${r.c===c.id?r.cls:""}">${r.cells.map((x,i)=>`<td class="${r.c===c.id&&r.chg[i]?"chg":""}">${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return `<div class="card exc"><div class="eh"><b>${esc(s.title)}</b><button class="btn s" onclick="go('sign','#${id}')">Open in PSMF</button></div><div class="eb">${body}</div></div>`}).join("")}
function escView(){const c=chBy(S.sel);const ev=(c.evidence||c.opts.map(o=>o.log)).filter((v,i,a)=>a.indexOf(v)===i).map(logBy);
 return `<button class="back" onclick="go('escs')">← Escalations</button><div class="grid g2"><div>${escCard(c,true,true)}
 <h2 class="sect">${c.status==="approved"?"In the PSMF":"In the PSMF if approved"}</h2>${excerpts(c)}</div>
 <div><h2>What was received</h2>${logTable(ev,true)}<h2 class="sect">Logbook entry if approved</h2><div class="card sm"><dl class="kv"><dt>Version</dt><dd>${nextVer()}</dd><dt>Change</dt><dd>${esc(fill(c.lt,c))}</dd><dt>Reason</dt><dd>${esc(c.log_reason)}</dd></dl></div></div></div>`}
function sources(){return `<div class="between" style="margin-bottom:20px"><h1>Sources</h1>${S.adding?"":`<button class="btn primary" onclick="S.adding='pick';render()">Connect a source</button>`}</div>${addPanel()}
 <div class="list scroll"><table><thead><tr><th>Source</th><th>Type</th><th>Feeds</th><th>Last received</th><th>Items</th><th>Status</th></tr></thead><tbody>${SOURCES.map(s=>{const l=LOG.filter(x=>x.src===s.id);return `<tr class="click" onclick="go('source','${s.id}')"><td><b style="font-weight:500">${esc(s.name)}</b><div class="sm mute">${esc(s.desc)}</div></td><td class="sm">${esc(s.kind)}</td><td class="sm">${esc(s.feeds)}</td><td class="sm">${l[0]?esc(l[0].d):"never"}</td><td>${l.length}</td><td>${s.silent?`<span class="pill flag">Silent</span>`:""}</td></tr>`}).join("")}</tbody></table></div>
 <p class="sm mute" style="margin-top:14px">Defaults: signed documents win over emails. QPPV and deputy changes always need you.</p>`}
function source(){const s=srcBy(S.sel),l=LOG.filter(x=>x.src===s.id);
 return `<button class="back" onclick="go('sources')">← Sources</button><div class="between"><div><h1>${esc(s.name)}</h1><p class="sub">${esc(s.desc)}</p></div>${s.silent?`<span class="pill flag">${esc(s.silent)}</span>`:""}</div>
 <div class="card" style="margin-bottom:20px"><dl class="kv"><dt>Type</dt><dd>${esc(s.kind)}</dd><dt>Owner</dt><dd>${esc(s.owner)}</dd><dt>Feeds</dt><dd>${esc(s.feeds)}</dd><dt>Connected since</dt><dd>${esc(s.since)}</dd><dt>Items received</dt><dd>${l.length}</dd></dl></div>
 <h2>Received</h2>${logTable(l,false)}`}
function activity(){const f=S.sel||"all";const rows=f==="all"?LOG:LOG.filter(l=>l.src===f);
 return `<div class="between"><div><h1 style="margin-bottom:20px">Activity</h1></div>
 <select onchange="S.sel=this.value;render()"><option value="all">All sources</option>${SOURCES.map(s=>`<option value="${s.id}" ${f===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}<option value="you" ${f==="you"?"selected":""}>Your decisions</option></select></div>${logTable(rows,true)}`}
function sign(){const dr=draft(),n=openEsc().length;
 const toc=BASE.map(s=>`<button onclick="jump('d-${s.id}')">${esc(s.title)}</button>`).join("");
 return `<div class="between"><div><h1>Review and sign</h1><p class="sub">${dr.length?`Draft ${nextVer()}, ${dr.length} changes since ${S.ver}`:`Version ${S.ver} is current. No changes to sign.`}</p></div></div>
 ${S.flash?`<div class="banner note">${S.flash}</div>`:""}
 <div class="layout"><div class="tocw stick toc"><div class="sm mute" style="margin-bottom:6px">Contents</div><button onclick="jump('d-cover')">Cover</button>${toc}</div>
 <div class="card doc" id="doc">${docHTML(true)}</div>
 <div class="stick"><div class="card"><h2>Changes</h2>${dr.length?dr.map(c=>{const l=received(c);return `<div class="chg" onclick="jumpC('${c.id}')"><div class="ct">${esc(fill(c.lt,c))}</div><dl class="kv"><dt>Source</dt><dd>${esc(srcBy(l.src).name)}<div class="mute">${esc(l.item)}</div></dd><dt>Received</dt><dd>${esc(l.d)}</dd><dt>Resolved by</dt><dd>${c.kind==="esc"?ME:c.overridden?ME+" (override)":"System"}</dd><dt>Where</dt><dd>${whereOf(c)}</dd></dl></div>`}).join(""):`<p class="mute">No changes.</p>`}
 ${dr.length?`<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:14px">${n?`<div class="banner flag">${n} open escalation${n>1?"s":""}. Resolve to sign. <button class="btn s" onclick="go('escs')">Open escalations</button></div>`
 :`<div class="sm mute" style="margin-bottom:8px">Signing as ${ME}, QPPV. Meaning: approved for release.</div><input type="password" id="pw" placeholder="Password to confirm" style="width:100%;margin-bottom:8px" oninput="el('err').textContent=''"><button class="btn primary" onclick="doSign()">Sign version ${nextVer()}</button><div class="err" id="err"></div>`}</div>`:""}</div></div></div>`}
function jump(id){const e=el(id);if(e)e.scrollIntoView({behavior:"smooth",block:"start"})}
function jumpC(id){document.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"));const t=[...document.querySelectorAll(`[data-c="${id}"]`)];t.forEach(x=>x.classList.add("hl"));if(t[0])t[0].scrollIntoView({behavior:"smooth",block:"center"})}
function doSign(){if(!el("pw").value){el("err").textContent="Enter your password to sign.";return}
 const v=nextVer();for(const c of draft()){c.released=v;c.relDate="5 Oct 2026"}
 S.ver=v;S.signedOn="5 Oct 2026";S.history.unshift([v,"5 Oct 2026",ME]);
 LOG.unshift({id:"SIG"+v,d:"5 Oct 2026",src:"you",item:`Signed version ${v}`,from:ME,out:"appr"});
 S.flash=`Version ${v} signed. Version ${parseInt(v)-1}.0 superseded.`;render()}
function updView(){const c=chBy(S.sel),l=logBy(c.log),src=srcBy(l.src);const ed=S.editing===c.id;
 const state=c.released?`In signed version ${c.released}`:c.status==="reverted"?`Reverted by ${ME}`:c.overridden?`Overridden by ${ME}`:"Applied automatically";
 let actions="";
 if(!c.released){if(c.status==="reverted")actions=`<button class="btn" onclick="reapply('${c.id}')">Reapply</button>`;
  else if(!ed)actions=`<button class="btn" onclick="S.editing='${c.id}';render()">Override</button><button class="btn" onclick="revert('${c.id}')">Revert</button>`}
 const form=ed?`<div class="edits"><div class="sm mute" style="padding-top:8px">New values</div>${c.edits.map((e,i)=>{const lab=`<div class="sm mute">${LOC[e.loc]}</div>`;
  if(e.t==="text")return `<div class="ovf">${lab}<input id="ov-${i}-0" value="${esc(e.rep)}"></div>`;
  if(e.t==="cell")return `<div class="ovf">${lab}<input id="ov-${i}-0" value="${esc(e.val)}"></div>`;
  if(e.t==="add")return `<div class="ovf">${lab}<div class="cells">${e.row.map((x,j)=>`<input id="ov-${i}-${j}" value="${esc(x)}">`).join("")}</div></div>`;
  return `<div class="ovf">${lab}<span class="mute">Row removed: ${esc(e.key)}. Use Revert to keep it.</span></div>`}).join("")}
  <div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveOverride('${c.id}')">Save override</button><button class="btn ghost" onclick="S.editing=null;render()">Cancel</button></div><div class="err" id="err"></div></div>`:"";
 return `<button class="back" onclick="go('activity')">← Activity</button><div class="grid g2"><div>
 <div class="esc"><div class="between"><h3>${esc(c.title)}</h3><span class="pill">${state}</span></div>
 <p class="why">Applied ${esc(l.d)} from ${esc(src.name)}: ${esc(l.item)}</p>${form}${actions?`<div class="row" style="margin-top:12px">${actions}</div>`:""}</div>
 <h2 class="sect">${c.status==="reverted"?"In the PSMF if reapplied":"In the PSMF"}</h2>${excerpts(c)}</div>
 <div><h2>What was received</h2>${logTable([l],true)}${c.nolog?"":`<h2 class="sect">Logbook entry</h2><div class="card sm"><dl class="kv"><dt>Version</dt><dd>${esc(c.released||nextVer())}</dd><dt>Change</dt><dd>${esc(c.lt)}</dd><dt>Reason</dt><dd>${esc(c.log_reason)}</dd></dl></div>`}</div></div>`}
function saveOverride(id){const c=chBy(id);const v=(i,j)=>{const x=document.getElementById(`ov-${i}-${j}`);return x?x.value.trim():null};
 for(const [i,e] of c.edits.entries()){if(e.t==="cell"&&!v(i,0)){el("err").textContent="Enter a value for "+LOC[e.loc]+".";return}
  if(e.t==="add"&&e.row.some((x,j)=>!v(i,j))){el("err").textContent="Fill every cell of the "+LOC[e.loc]+" row.";return}}
 c.orig=c.orig||JSON.parse(JSON.stringify(c.edits));
 c.edits.forEach((e,i)=>{if(e.t==="text")e.rep=v(i,0);if(e.t==="cell")e.val=v(i,0);if(e.t==="add")e.row=e.row.map((x,j)=>v(i,j))});
 c.overridden=true;S.editing=null;LOG.unshift({id:"O"+id+Date.now(),d:"5 Oct 2026",src:"you",item:`Overridden: ${c.title}`,from:ME,out:"ovr",ref:id});render()}
function revert(id){const c=chBy(id);c.status="reverted";LOG.unshift({id:"R"+id,d:"5 Oct 2026",src:"you",item:`Reverted: ${c.title}`,from:ME,out:"rev",ref:id});render()}
function reapply(id){const c=chBy(id);c.status="applied";LOG=LOG.filter(l=>l.id!=="R"+id);render()}
const STYPES={folder:["SharePoint or OneDrive folder","Files added or changed in a folder"],system:["Connected system","Contracts, SOPs, people or safety data"],person:["Person to ask","A quarterly question by email"],sender:["Allowed sender","Someone who may send to the intake email"]};
const SYSTEMS=[["DocuSign","Contracts","Section 2, 3, Annex B, C"],["Veeva QualityDocs","Procedures","Section 5, 7, Annex E"],["Veeva Vault QMS","Audits and CAPAs","Section 7, Annex G"],["Workday","People","Section 1, Annex A"],["Oracle Argus Safety","Safety data","Section 6, Annex F"],["Biologit","Literature screening","Section 6, Annex F"]];
function addPanel(){const a=S.adding;if(!a)return "";
 const cancel=`<button class="btn ghost" onclick="S.adding=null;render()">Cancel</button>`;
 if(a==="pick")return `<div class="card addp"><div class="between"><h3>What do you want to connect?</h3>${cancel}</div><div class="types">${Object.entries(STYPES).map(([k,t])=>`<button onclick="S.adding='${k}';render()"><div>${t[0]}</div><div class="d">${t[1]}</div></button>`).join("")}</div></div>`;
 const f={folder:`<div class="fld"><label for="f1">Folder path</label><input id="f1" placeholder="/sites/HalvorsenQA/Shared Documents/SDEAs"></div>`,
  system:`<div class="fld"><label for="f1">System</label><select id="f1">${SYSTEMS.map((x,i)=>`<option value="${i}">${x[0]}</option>`).join("")}</select></div>`,
  person:`<div class="fld"><label for="f1">Name</label><input id="f1" placeholder="Jonas Holm"></div><div class="fld"><label for="f2">Email</label><input id="f2" placeholder="jonas.holm@halvorsen.dk"></div>`,
  sender:`<div class="fld"><label for="f1">Email</label><input id="f1" placeholder="pv@nordviapharma.se"></div>`}[a];
 const btn={folder:"Connect with Microsoft",system:"Connect",person:"Add person",sender:"Add sender"}[a];
 return `<div class="card addp"><div class="between"><h3>${STYPES[a][0]}</h3><button class="btn ghost" onclick="S.adding='pick';render()">Back</button></div>${f}<div class="row" style="margin-top:14px"><button class="btn primary" onclick="addSource()">${btn}</button>${cancel}</div><div class="err" id="err"></div></div>`}
function addSource(){const a=S.adding,v=i=>{const x=el("f"+i);return x?x.value.trim():""};let src;
 if(a==="folder"){if(!v(1)){el("err").textContent="Enter the folder path.";return}src={name:"Folder · "+v(1).split("/").filter(Boolean).pop(),kind:"SharePoint folder",feeds:"Any",desc:v(1)}}
 if(a==="system"){const x=SYSTEMS[+v(1)];src={name:`${x[1]} · ${x[0]}`,kind:"Connected system",feeds:x[2],desc:`${x[1]} from ${x[0]}.`}}
 if(a==="person"){if(!v(1)||!/^\S+@\S+\.\S+$/.test(v(2))){el("err").textContent="Enter a name and a valid email.";return}src={name:`Check-in · ${v(1)}`,kind:"Quarterly question",feeds:"As answered",desc:`Asked quarterly at ${v(2)}.`}}
 if(a==="sender"){if(!/^\S+@\S+\.\S+$/.test(v(1))){el("err").textContent="Enter a valid email.";return}src={name:v(1),kind:"Allowed sender",feeds:"Any",desc:"May send to halvorsen@intake.meridianpv.eu."}}
 const id="n"+Date.now();SOURCES.push({id,owner:ME,since:"Oct 2026",...src});
 LOG.unshift({id:"C"+id,d:"5 Oct 2026",src:"you",item:`Connected: ${src.name}`,from:ME,out:"none"});S.adding=null;render()}
function render(){nav();const v={home,escs,esc:escView,upd:updView,sources,source,activity,sign}[S.page]||home;el("view").innerHTML=v();
 if(S.page==="sign"&&S.sel){const t=S.sel;setTimeout(()=>t.startsWith("#")?jump("d-"+t.slice(1)):jumpC(t),50)}}
render();
</script>
</body>
