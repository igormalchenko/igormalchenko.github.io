<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Igor Malchenko, founder of Coolstory. Ex-product exec at PandaDoc, Reply, and Unisender." />
        <meta name="color-scheme" content="light dark" />
        <title>Igor Malchenko</title>
        <link rel="icon" type="image/png" href="assets/img/favicon.png" />
        <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

        <!-- Link previews -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://imalchenko.com/" />
        <meta property="og:title" content="Igor Malchenko" />
        <meta property="og:description" content="Founder of Coolstory. On a mission to fix SaaS activation and adoption once and for all." />
        <meta property="og:image" content="https://imalchenko.com/assets/img/profile.jpg" />
        <meta property="og:image:width" content="500" />
        <meta property="og:image:height" content="500" />
        <meta name="twitter:card" content="summary" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&family=Lato:wght@900&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-1: #f6efff;
                --bg-2: #fff0f3;
                --bg-3: #fff5e9;
                --ink: #221f29;
                --muted: #5d5967;
                --accent: #c2255c;
                --accent-hover: #9c1c49;
                --ring: rgba(194, 37, 92, 0.25);
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg-1: #17141d;
                    --bg-2: #1c1419;
                    --bg-3: #1d1813;
                    --ink: #f2eef5;
                    --muted: #aaa4b3;
                    --accent: #ff8fab;
                    --accent-hover: #ffb3c5;
                    --ring: rgba(255, 143, 171, 0.3);
                }
            }

            * { box-sizing: border-box; }
            html {
                min-height: 100%;
                background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%) fixed;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                font-family: Karla, sans-serif;
                font-size: 1.25rem;
                line-height: 1.6;
                color: var(--ink);
            }
            main {
                width: 100%;
                max-width: 38rem;
                padding: 4rem 1.5rem;
            }

            .avatar {
                display: block;
                width: 7.5rem;
                height: 7.5rem;
                margin-bottom: 2rem;
                border-radius: 50%;
                object-fit: cover;
                box-shadow: 0 0 0 4px var(--bg-2), 0 0 0 7px var(--ring), 0 12px 32px -12px rgba(0, 0, 0, 0.35);
            }
            h1 {
                margin: 0 0 2rem;
                font-family: Lato, sans-serif;
                font-weight: 900;
                font-size: clamp(2.75rem, 10vw, 4.5rem);
                line-height: 1.05;
                letter-spacing: -0.02em;
            }
            h1 span { color: var(--accent); }

            a {
                color: var(--accent);
                font-weight: 600;
                text-decoration: underline;
                text-decoration-thickness: 1.5px;
                text-underline-offset: 0.2em;
                text-decoration-color: var(--ring);
                transition: color 0.15s, text-decoration-color 0.15s;
            }
            a:hover {
                color: var(--accent-hover);
                text-decoration-color: currentColor;
            }

            .facts {
                list-style: none;
                margin: 0 0 2.5rem;
                padding: 0;
            }
            .facts li {
                display: flex;
                gap: 0.75rem;
                padding: 0.2rem 0;
            }
            .facts .icon {
                flex: none;
                width: 1.5em;
                text-align: center;
            }

            .mission {
                margin: 0;
                color: var(--muted);
            }
        </style>
        <!-- Coolstory API -->
        <script type="module" src="https://app.coolstory.me/widget/widget.js?id=d85408be-5cb9-45e3-a180-d5d2b6119d55"></script>
    </head>
    <body>
        <main>
            <img class="avatar" src="assets/img/profile.jpg" alt="Igor Malchenko" id="avatar">
            <h1>Hey, I'm <span id="igor">Igor</span></h1>
            <div data-coolstory-id="b0c72b24-496b-4dd1-88e4-83e8eeefe842"></div>
            <ul class="facts">
                <li><span class="icon">👔</span><span>Founder of <a href="https://coolstory.me" target="_blank" id="coolstory">Coolstory</a></span></li>
                <li><span class="icon">💼</span><span>Ex-product exec at <a href="https://pandadoc.com" target="_blank" rel="nofollow noreferrer" id="pandadoc">PandaDoc</a>, <a href="https://reply.io" target="_blank" rel="nofollow noreferrer" id="reply">Reply</a>, and <a href="https://selzy.com/" target="_blank" rel="nofollow noreferrer" id="unisender">Unisender</a></span></li>
                <li><span class="icon">🎮</span><span>Co-founder of <a href="https://gametree.me/" target="_blank" rel="nofollow noreferrer" id="gametree">GameTree</a></span></li>
                <li><span class="icon">🏃‍♂️</span><span>OCR runner</span></li>
                <li><span class="icon">🎤</span><span>Speaker</span></li>
            </ul>
            <p class="mission">
                On a mission to fix SaaS activation and adoption once and for all.<br>
                Want to work together? <a href="https://www.linkedin.com/in/imalchenko/" target="_blank" rel="nofollow noreferrer" id="linkedin">DM me</a>.
            </p>
        </main>
    </body>
</html>
